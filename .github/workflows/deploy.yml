# Publishes the site to GitHub Pages on every push to main.
# One-time setup (repo Settings): Pages → Source = "GitHub Actions". For the real site also set Variables → PUBLIC_BOARD_URL, PUBLIC_BOARD_KEY, PUBLIC_FORMSPREE_ENDPOINT;
# with none of them set it publishes a preview (in-memory board with example ideas); with only some set it fails.
# These three values end up in the public site by design, so they are Variables, not Secrets.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PUBLIC_BASE_PATH: /IDEASKY/
  PUBLIC_BOARD_URL: ${{ vars.PUBLIC_BOARD_URL }}
  PUBLIC_BOARD_KEY: ${{ vars.PUBLIC_BOARD_KEY }}
  PUBLIC_FORMSPREE_ENDPOINT: ${{ vars.PUBLIC_FORMSPREE_ENDPOINT }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # All three services set: the live site. None set: a preview (in-memory board, example ideas). Some set: stop, naming what is missing.
      - name: Choose live or preview
        run: node scripts/deploy-mode.mjs
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
